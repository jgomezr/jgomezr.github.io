<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

function xmlEscape(text) {
  return String(text)
    .replace(/[^\t\n\r -퟿-�\u{10000}-\u{10FFFF}]/gu, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Excel stores a date as days since 1899-12-30, in local time.
function excelDate(y, m, d, hh = 0, mm = 0) {
  return (Date.UTC(y, m, d, hh, mm) - Date.UTC(1899, 11, 30)) / 86400000;
}

function excelTime(time) {
  const d = new Date(time);
  return excelDate(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes());
}

function columnName(index) {
  let name = '';
  for (let n = index + 1; n > 0; n = Math.floor((n - 1) / 26)) name = String.fromCharCode(65 + ((n - 1) % 26)) + name;
  return name;
}

// A cell is a string, a number, or [value, style].
function sheetXml(sheet) {
  const rows = sheet.rows.map((cells, r) => {
    const body = cells.map((cell, c) => {
      const [value, style] = Array.isArray(cell) ? cell : [cell, r === 0 ? STYLE.head : STYLE.text];
      const ref = `${columnName(c)}${r + 1}`;
      return typeof value === 'number'
        ? `<c r="${ref}" s="${style}"><v>${value}</v></c>`
        : `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(value)}</t></is></c>`;
    }).join('');
    return `<row r="${r + 1}">${body}</row>`;
  }).join('');
  const cols = sheet.widths.map((width, i) => `<col min="${i + 1}" max="${i + 1}" width="${width}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${rows}</sheetData></worksheet>`;
}

const CRC_TABLE = Array.from({ length: 256 }, (_, n) => {
  let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
  return c >>> 0;
});

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (const byte of bytes) crc = CRC_TABLE[(crc ^ byte) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function zipStored(files) {
  const encoder = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const header = (fields) => {
    const size = fields.reduce((sum, [, width]) => sum + width, 0);
    const view = new DataView(new ArrayBuffer(size));
    let at = 0;
    for (const [value, width] of fields) {
      if (width === 2) view.setUint16(at, value, true);
      else view.setUint32(at, value, true);
      at += width;
    }
    return new Uint8Array(view.buffer);
  };
  for (const [path, text] of files) {
    const name = encoder.encode(path);
    const data = encoder.encode(text);
    const crc = crc32(data);
    // version 20, UTF-8 names, stored, and the DOS date 1980-01-01
    const common = [[20, 2], [0x0800, 2], [0, 2], [0, 2], [0x21, 2], [crc, 4], [data.length, 4], [data.length, 4], [name.length, 2], [0, 2]];
    const local = header([[0x04034B50, 4], ...common]);
    chunks.push(local, name, data);
    central.push(header([[0x02014B50, 4], [20, 2], ...common, [0, 2], [0, 2], [0, 2], [0, 4], [offset, 4]]), name);
    offset += local.length + name.length + data.length;
  }
  const centralSize = central.reduce((sum, part) => sum + part.length, 0);
  const end = header([[0x06054B50, 4], [0, 2], [0, 2], [files.length, 2], [files.length, 2], [centralSize, 4], [offset, 4], [0, 2]]);
  return new Blob([...chunks, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function periodRows(active, keyOf, cellOf, firstHeader) {
  const groups = new Map();
  for (const sale of active) {
    const key = keyOf(new Date(sale.time));
    const row = groups.get(key) ?? { key, receipts: 0, sales: 0, profit: 0 };
    row.receipts += 1;
    row.sales += saleTotal(sale);
    row.profit += saleProfit(sale);
    groups.set(key, row);
  }
  const rows = [...groups.values()].sort((a, b) => a.key - b.key);
  const sum = (field) => rows.reduce((total, row) => total + row[field], 0);
  return [
    [firstHeader, 'Recibos', 'Ventas', 'Ganancia'],
    ...rows.map((row) => [cellOf(row.key), row.receipts, [row.sales, STYLE.money], [row.profit, STYLE.money]]),
    [['Total', STYLE.totalText], [sum('receipts'), STYLE.totalNumber], [sum('sales'), STYLE.totalMoney], [sum('profit'), STYLE.totalMoney]],
  ];
}

function workbookSheets() {
  const inOrder = [...sales].sort((a, b) => a.time - b.time);
  const active = inOrder.filter((sale) => sale.status === 'activa');
  const totals = productTotals(active);
  const widths = [14, 10, 14, 14];
  return [
    { name: 'Por día', widths, rows: periodRows(active, (d) => excelDate(d.getFullYear(), d.getMonth(), d.getDate()), (key) => [key, STYLE.date], 'Día') },
    { name: 'Por mes', widths, rows: periodRows(active, (d) => excelDate(d.getFullYear(), d.getMonth(), 1), (key) => [key, STYLE.month], 'Mes') },
    { name: 'Por año', widths, rows: periodRows(active, (d) => d.getFullYear(), (key) => key, 'Año') },
    {
      name: 'Por producto',
      widths: [36, 10, 14, 14],
      rows: [
        ['Producto', 'Unidades', 'Ventas', 'Ganancia'],
        ...totals.map((row) => [row.name, row.qty, [row.sales, STYLE.money], [row.profit, STYLE.money]]),
        [['Total', STYLE.totalText],
          [totals.reduce((sum, row) => sum + row.qty, 0), STYLE.totalNumber],
          [totals.reduce((sum, row) => sum + row.sales, 0), STYLE.totalMoney],
          [totals.reduce((sum, row) => sum + row.profit, 0), STYLE.totalMoney]],
      ],
    },
    {
      name: 'Detalle de ventas',
      widths: [10, 18, 10, 36, 10, 12, 16, 12, 14],
      rows: [
        ['Recibo', 'Fecha', 'Estado', 'Producto', 'Cantidad', 'Precio', 'Ganancia unidad', 'Total', 'Ganancia'],
        ...inOrder.flatMap((sale) => sale.items.map((item) => [
          sale.number, [excelTime(sale.time), STYLE.dateTime], sale.status === 'anulada' ? 'Anulada' : 'Activa', item.name, item.qty,
          [item.price, STYLE.money], [item.profit, STYLE.money], [item.qty * item.price, STYLE.money], [item.qty * item.profit, STYLE.money],
        ])),
      ],
    },
    {
      name: 'Catálogo',
      widths: [36, 14, 16],
      rows: [
        ['Producto', 'Precio', 'Ganancia unidad'],
        ...products.map((p) => [p.name, [p.price, STYLE.money], [p.profit, STYLE.money]]),
      ],
    },
  ];
}

function exportWorkbook() {
  const sheets = workbookSheets();
  const sheetTags = sheets.map((sheet, i) => `<sheet name="${xmlEscape(sheet.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');
  const relations = sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('');
  const overrides = sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
  const blob = zipStored([
    ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${overrides}</Types>`],
    ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheetTags}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${relations}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', STYLES_XML],
    ...sheets.map((sheet, i) => [`xl/worksheets/sheet${i + 1}.xml`, sheetXml(sheet)]),
  ]);
  const now = new Date();
  const two = (n) => String(n).padStart(2, '0');
  const link = h('a', { href: URL.createObjectURL(blob), download: `talonario-ventas-${now.getFullYear()}-${two(now.getMonth() + 1)}-${two(now.getDate())}.xlsx` });
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

// Navegación

function render() {
  const focused = document.activeElement?.id;
  const [route, param] = location.hash.slice(1).split('/');
  const screens = {
    pedido: renderOrder,
    productos: renderProducts,
    historial: renderHistory,
    reportes: () => renderReports(param),
    configuracion: renderStore,
    recibo: () => renderReceipt(Number(param)),
  };
  const active = screens[route] ? route : 'pedido';
  renderBrand();
  const view = document.getElementById('view');
  view.replaceChildren(...screens[active]());

  const tab = active === 'recibo' ? 'historial' : active;
  document.querySelectorAll('.tabs a').forEach((link) => {
    if (link.dataset.tab === tab) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  afterRender.splice(0).forEach((draw) => draw());
  // Screens are rebuilt on every change; keep keyboard users where they were.
  if (focused) {
    const element = document.getElementById(focused);
    if (element && !element.disabled) element.focus();
  }
}

window.addEventListener('hashchange', () => {
  render();
  window.scrollTo(0, 0);
});

(async () => {
  try {
    db = await openDb();
    await load();
    if (!location.hash) {
      const start = !store.name ? '#configuracion' : products.length === 0 ? '#productos' : '#pedido';
      history.replaceState(null, '', start);

    render();

    );
  }
})();
