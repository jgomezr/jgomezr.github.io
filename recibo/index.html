:root {
  --ground: #f4f3f1;
  --surface: #ffffff;
  --raised: #eeeeee;
  --active: #e7e6e3;
  --border: #e6e6e6;
  --rule: #f0f0f0;
  --control: #d4d4d4;
  --text: #0a0a0a;
  --muted: #6b6b6b;
  --primary: #141414;
  --data: #1d5fbf;
  --negative: #c4242a;
  --pill-negative-bg: #ffedea;
  --pill-negative-ink: #831c1e;
  --grid: #e5e5e5;
  --radius-card: 8px;
  --radius-control: 6px;
  --gap: 12px;
  --card-pad: 20px;
  --row: 44px;
  --control-height: 36px;
  --fs-title: 24px;
  --fs-section: 16px;
  --fs-kpi: 30px;
  --fs-body: 14px;
  --fs-small: 12px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font: 400 var(--fs-body)/20px "Geist", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
a { color: inherit; }
h1, h2, p { margin: 0; }

/* Shell: 240 sidebar + fluid canvas with one 32px gutter */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100dvh; }
.sidebar { position: sticky; top: 0; align-self: start; height: 100dvh; padding: 20px 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 8px; margin-bottom: 24px; }
.brand svg, .brand img { flex: none; width: 28px; height: 28px; object-fit: contain; border-radius: 4px; }
.brand svg { fill: var(--primary); }
.brand-text { display: grid; min-width: 0; }
.brand-name { font-weight: 500; }
.brand-store { color: var(--muted); font-size: var(--fs-small); line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: var(--radius-control); color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--text); }
.nav a[aria-current="page"] { background: var(--active); color: var(--text); }
.nav svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }

main { padding: 32px; min-width: 0; }
.canvas { max-width: 1240px; margin: 0 auto; }
.title-row { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; margin-bottom: 24px; }
h1 { font-size: var(--fs-title); line-height: 32px; font-weight: 500; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.subtitle { color: var(--muted); margin-top: 2px; }
.title-actions { display: flex; flex-wrap: wrap; gap: 8px; }
h2 { font-size: var(--fs-section); line-height: 24px; font-weight: 500; overflow-wrap: anywhere; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); }
.card-pad { padding: var(--card-pad); }
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); align-items: start; }
.sticky { position: sticky; top: 32px; }
@media (min-width: 1100px) {
  .split.side { grid-template-columns: minmax(0, 1fr) 340px; }
  .split.half { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

.button {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--control-height); padding: 0 14px;
  border: 1px solid var(--control); border-radius: var(--radius-control);
  background: var(--surface); color: var(--text);
  font-family: inherit; font-size: var(--fs-body); font-weight: 500; line-height: 20px; text-align: center; text-decoration: none;
  cursor: pointer;
}
.button:hover { background: var(--raised); }
.button:active { background: var(--active); }
.button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.button.primary:hover { background: #333; }
.button.primary:disabled { background: var(--raised); border-color: var(--raised); color: var(--muted); cursor: default; }
.button.danger { color: var(--negative); }
.button.wide { width: 100%; }
.text-action { min-height: 28px; padding: 0 6px; border: 0; border-radius: 4px; background: none; color: var(--text); font: inherit; cursor: pointer; }
.text-action:hover { background: var(--raised); }

.empty { padding: 16px; border: 1px dashed var(--control); border-radius: var(--radius-card); display: grid; gap: 12px; justify-items: start; }
.empty p { max-width: 60ch; }

/* Tables */
table { width: 100%; border-collapse: collapse; }
th { height: 40px; padding: 0 16px; color: var(--muted); font-size: var(--fs-small); font-weight: 400; text-align: left; }
td { height: var(--row); padding: 10px 16px; border-top: 1px solid var(--rule); overflow-wrap: anywhere; }
.num { text-align: right; white-space: nowrap; }
.identity { font-weight: 500; }
.sub { display: none; color: var(--muted); font-size: var(--fs-small); line-height: 16px; font-weight: 400; }
.row-actions { width: 1%; white-space: nowrap; text-align: right; padding-right: 10px; }
.row-link { text-decoration: none; font-weight: 500; }
.row-link:hover { text-decoration: underline; }
tbody tr:hover { background: #fafafa; }
.voided { color: var(--muted); }
.voided .money { text-decoration: line-through; }
.money { font-weight: 700; }
.pill { flex: none; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 4px; background: var(--pill-negative-bg); color: var(--pill-negative-ink); font-size: var(--fs-small); font-weight: 500; white-space: nowrap; letter-spacing: 0; }

/* Order */
.order-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 8px 16px; border-top: 1px solid var(--rule); }
.order-row:first-child { border-top: 0; }
.order-name { display: grid; min-width: 0; }
.order-name b { font-weight: 500; overflow-wrap: anywhere; }
.order-name span { color: var(--muted); }
.stepper { display: flex; align-items: center; flex: none; }
.stepper output { width: 36px; text-align: center; font-size: var(--fs-section); color: var(--muted); }
.stepper.chosen output { color: var(--data); font-weight: 500; }
.stepper button { width: var(--control-height); height: var(--control-height); border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); color: var(--text); font-family: inherit; font-size: 18px; line-height: 1; cursor: pointer; }
.stepper button:hover:not(:disabled) { background: var(--raised); }
.stepper button:disabled { color: #8a8a8a; border-color: var(--border); cursor: default; }
.summary-label { color: var(--muted); }
.summary-total { font-size: var(--fs-kpi); line-height: 38px; font-weight: 700; letter-spacing: -.02em; display: block; }
.summary-lines { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 6px; }
.summary-lines li { display: flex; justify-content: space-between; gap: 12px; }
.summary-lines .qty { color: var(--data); font-weight: 500; }
.capacity { margin: 16px 0; }
.capacity-head { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: var(--fs-small); line-height: 16px; margin-bottom: 6px; }
.capacity-head b { color: var(--text); font-weight: 500; }
.capacity-track { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.capacity-fill { display: block; height: 100%; background: var(--data); }
.capacity-note { margin-top: 8px; color: var(--pill-negative-ink); }

@media (min-width: 1100px) {
  .products-grid > form { order: 2; position: sticky; top: 32px; }
}

/* Forms */
.form { display: grid; gap: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
label { display: grid; gap: 8px; font-weight: 500; align-content: start; }
input { width: 100%; min-height: 40px; padding: 0 12px; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); color: var(--text); font-family: inherit; font-size: var(--fs-body); }
.field-error { color: var(--negative); }
.form-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.field-help { color: var(--muted); font-size: var(--fs-small); line-height: 16px; font-weight: 400; }
.segmented { display: inline-flex; justify-self: start; padding: 2px; border-radius: var(--radius-control); background: var(--raised); }
.segmented button { min-height: calc(var(--control-height) - 4px); padding: 0 12px; border: 0; border-radius: 4px; background: none; color: var(--muted); font-family: inherit; font-size: var(--fs-body); cursor: pointer; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 500; }

.segmented a { display: inline-flex; align-items: center; min-height: calc(var(--control-height) - 4px); padding: 0 14px; border-radius: 4px; color: var(--muted); text-decoration: none; }
.segmented a[aria-current="true"] { background: var(--surface); color: var(--text); font-weight: 500; }

/* Reports */
.report-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--gap) 24px; margin-bottom: var(--gap); }
.period { display: flex; align-items: center; gap: 8px; }
.period .button { width: var(--control-height); padding: 0; font-size: 18px; }
.period .button:disabled { color: #8a8a8a; border-color: var(--border); cursor: default; background: var(--surface); }
.period-label { min-width: 11em; text-align: center; font-weight: 500; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: var(--gap); overflow: hidden; }
.kpi { display: grid; align-content: start; gap: 2px; padding: 16px var(--card-pad); border: 0; border-left: 1px solid var(--border); border-bottom: 2px solid transparent; background: none; color: inherit; font: inherit; text-align: left; }
.kpi:first-child { border-left: 0; }
button.kpi { cursor: pointer; }
button.kpi:hover { background: #fafafa; }
.kpi[aria-pressed="true"] { border-bottom-color: var(--text); }
.kpi-label { color: var(--muted); }
.kpi-lead { font-size: var(--fs-kpi); line-height: 38px; letter-spacing: -.02em; }
.kpi-value { font-size: 22px; line-height: 38px; font-weight: 500; }
.kpi-value.money { font-weight: 700; }
.kpi-note { color: var(--muted); font-size: var(--fs-small); line-height: 16px; }
.loss { color: var(--negative); }
.card-head { padding: var(--card-pad) 16px 4px; }
.card-empty { padding: 8px 16px var(--card-pad); color: var(--muted); }
.chart { margin-top: 12px; min-height: 200px; min-width: 0; overflow: hidden; }
.chart svg { display: block; }
.chart-grid { stroke: var(--grid); }
.chart-zero { stroke: var(--muted); }
.chart-text { fill: var(--muted); font-size: var(--fs-small); }
.chart-bar { fill: var(--data); shape-rendering: crispEdges; }
.chart-loss { fill: var(--negative); }

.licenses { padding: 0 var(--card-pad); }
.license { display: grid; gap: 4px; justify-items: start; padding: 16px 0; border-top: 1px solid var(--rule); }
.license:first-child { border-top: 0; }
.license-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
h3 { margin: 0; font-size: var(--fs-body); line-height: 20px; font-weight: 500; }
.license-kind, .license p { color: var(--muted); margin: 0; }
.license details { width: 100%; margin-top: 4px; }
.license summary { cursor: pointer; }
.license pre { max-height: 240px; margin: 8px 0 0; padding: 12px 14px; overflow: auto; border-radius: var(--radius-control); background: var(--ground); font-family: inherit; font-size: 13px; line-height: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Store settings */
.setting { display: grid; gap: 16px 32px; padding: 32px 0; border-top: 1px solid var(--control); }
.setting:first-of-type { border-top: 0; padding-top: 0; }
.setting p { color: var(--muted); margin-top: 4px; max-width: 42ch; }
@media (min-width: 1100px) { .setting { grid-template-columns: 340px minmax(0, 1fr); } }
.preview { padding: 12px 14px; border-radius: var(--radius-control); background: var(--ground); white-space: pre-line; overflow-wrap: anywhere; }
.preview-label { color: var(--muted); font-size: var(--fs-small); line-height: 16px; margin-bottom: 6px; }
.logo-field { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { display: block; width: 72px; height: 72px; object-fit: contain; }
.logo-pick { display: inline-flex; font-weight: 500; }
.logo-pick:focus-within { outline: 2px solid var(--text); outline-offset: 2px; border-radius: var(--radius-control); }
.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; }
.stamp { color: var(--muted); }
.stamp:empty { display: none; }

/* Counts that filter */
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.count { display: grid; gap: 2px; min-height: 61px; padding: 12px; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); cursor: pointer; }
.count span { color: var(--muted); font-size: 13px; }
.count b { font-size: var(--fs-section); font-weight: 500; }
.count[aria-pressed="true"] { border: 1.500px solid var(--text); }

/* Receipt */
.qr-card { display: grid; gap: 16px; }
.qr-code { display: block; width: min(100%, 420px); margin: 0 auto; background: #fff; }
.sale-head { display: flex; align-items: center; gap: 12px; padding: var(--card-pad) 16px 12px; }
.sale-head .logo { flex: none; width: 44px; height: 44px; }
.sale-head p { color: var(--muted); }
.sale-total { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 16px; border-top: 1px solid var(--border); }
.sale-total .summary-total { text-align: right; }
.qty-col { width: 1%; white-space: nowrap; }

@media (max-width: 899px) {
  :root { --control-height: 44px; --row: 52px; }
  .shell { display: block; padding-bottom: 64px; }
  .sidebar { position: static; height: auto; padding: 0; }
  .brand { margin: 0; padding: 0 16px; min-height: 48px; background: var(--ground); border-bottom: 1px solid var(--border); }
  .brand svg, .brand img { width: 24px; height: 24px; }
  .nav { position: fixed; z-index: 2; inset: auto 0 0; grid-template-columns: repeat(5, 1fr); gap: 0; height: 60px; padding: 4px; background: var(--surface); border-top: 1px solid var(--border); }
  .nav a { flex-direction: column; justify-content: center; gap: 2px; height: auto; font-size: var(--fs-small); line-height: 16px; padding: 0; }
  main { padding: 16px; }
  input { min-height: 44px; font-size: 16px; }
  .title-row { margin-bottom: 16px; }
  .checkout { position: sticky; bottom: 72px; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 16px; padding: 12px 16px; }
  .checkout .button { grid-column: 2; grid-row: 1 / span 2; width: auto; }
  .checkout .capacity { grid-column: 1 / -1; margin: 10px 0 0; }
  .summary-lines { display: none; }
  .summary-total { font-size: 24px; line-height: 30px; }
  .sticky { position: sticky; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis > :first-child { grid-column: 1 / -1; border-bottom: 1px solid var(--border); }
  .kpis > :first-child[aria-pressed="true"] { border-bottom: 2px solid var(--text); }
  .kpis > :nth-child(2) { border-left: 0; }
  .text-action { min-height: 44px; }
}
@media (max-width: 640px) {
  th, td { padding-left: 12px; padding-right: 12px; }
  .wide-col { display: none; }
  .sub { display: block; font-size: 13px; line-height: 18px; }
  th { font-size: 13px; }
  .row-actions { padding-right: 4px; }
  .title-actions { width: 100%; }
  .period { flex: 1 1 100%; justify-content: space-between; }
  .title-actions > * { flex: 1 1 0; }
}
@media (min-width: 900px) and (max-width: 1099px) {
  .checkout.sticky { position: sticky; top: auto; bottom: 12px; }
  .summary-lines { display: none; }
}
</style>

</div>

<script>
//---------------------------------------------------------------------
//

//---------------------------------------------------------------------
// qrcode
//---------------------------------------------------------------------

/**
 * qrcode
 * @param typeNumber 1 to 40
 * @param errorCorrectionLevel 'L','M','Q','H'
 */
const qrcode = function(typeNumber, errorCorrectionLevel) {

  const PAD0 = 0xEC;
  const PAD1 = 0x11;

  let _typeNumber = typeNumber;
  const _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
  let _modules = null;
  let _moduleCount = 0;
  let _dataCache = null;
  const _dataList = [];

  const _this = {};

  const makeImpl = function(test, maskPattern) {

    _moduleCount = _typeNumber * 4 + 17;
    _modules = function(moduleCount) {
      const modules = new Array(moduleCount);
      for (let row = 0; row < moduleCount; row += 1) {
        modules[row] = new Array(moduleCount);
        for (let col = 0; col < moduleCount; col += 1) {
          modules[row][col] = null;
        }
      }
      return modules;
    }(_moduleCount);

    setupPositionProbePattern(0, 0);
    setupPositionProbePattern(_moduleCount - 7, 0);
    setupPositionProbePattern(0, _moduleCount - 7);
    setupPositionAdjustPattern();
    setupTimingPattern();
    setupTypeInfo(test, maskPattern);

    if (_typeNumber >= 7) {
      setupTypeNumber(test);
    }

    if (_dataCache == null) {
      _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
    }

    mapData(_dataCache, maskPattern);
  };

  const setupPositionProbePattern = function(row, col) {

    for (let r = -1; r <= 7; r += 1) {

      if (row + r <= -1 || _moduleCount <= row + r) continue;

      for (let c = -1; c <= 7; c += 1) {

        if (col + c <= -1 || _moduleCount <= col + c) continue;

        if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
            || (0 <= c && c <= 6 && (r == 0 || r == 6) )
            || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
          _modules[row + r][col + c] = true;
        } else {
          _modules[row + r][col + c] = false;
        }
      }
    }
  };

  const getBestMaskPattern = function() {

    let minLostPoint = 0;
    let pattern = 0;

    for (let i = 0; i < 8; i += 1) {

      makeImpl(true, i);

      const lostPoint = QRUtil.getLostPoint(_this);

      if (i == 0 || minLostPoint > lostPoint) {
        minLostPoint = lostPoint;
        pattern = i;
      }
    }

    return pattern;
  };

  const setupTimingPattern = function() {

    for (let r = 8; r < _moduleCount - 8; r += 1) {
      if (_modules[r][6] != null) {
        continue;
      }
      _modules[r][6] = (r % 2 == 0);
    }

    for (let c = 8; c < _moduleCount - 8; c += 1) {
      if (_modules[6][c] != null) {
        continue;
      }
      _modules[6][c] = (c % 2 == 0);
    }
  };

  const setupPositionAdjustPattern = function() {

    const pos = QRUtil.getPatternPosition(_typeNumber);

    for (let i = 0; i < pos.length; i += 1) {

      for (let j = 0; j < pos.length; j += 1) {

        const row = pos[i];
        const col = pos[j];

        if (_modules[row][col] != null) {
          continue;
        }

        for (let r = -2; r <= 2; r += 1) {

          for (let c = -2; c <= 2; c += 1) {

            if (r == -2 || r == 2 || c == -2 || c == 2
                || (r == 0 && c == 0) ) {
              _modules[row + r][col + c] = true;
            } else {
              _modules[row + r][col + c] = false;
            }
          }
        }
      }
    }
  };

  const setupTypeNumber = function(test) {

    const bits = QRUtil.getBCHTypeNumber(_typeNumber);

    for (let i = 0; i < 18; i += 1) {
      const mod = (!test && ( (bits >> i) & 1) == 1);
      _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
    }

    for (let i = 0; i < 18; i += 1) {
      const mod = (!test && ( (bits >> i) & 1) == 1);
      _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
    }
  };

  const setupTypeInfo = function(test, maskPattern) {

    const data = (_errorCorrectionLevel << 3) | maskPattern;
    const bits = QRUtil.getBCHTypeInfo(data);

    // vertical
    for (let i = 0; i < 15; i += 1) {

      const mod = (!test && ( (bits >> i) & 1) == 1);

      if (i < 6) {
        _modules[i][8] = mod;
      } else if (i < 8) {
        _modules[i + 1][8] = mod;
      } else {
        _modules[_moduleCount - 15 + i][8] = mod;
      }
    }

    // horizontal
    for (let i = 0; i < 15; i += 1) {

      const mod = (!test && ( (bits >> i) & 1) == 1);

      if (i < 8) {
        _modules[8][_moduleCount - i - 1] = mod;
      } else if (i < 9) {
        _modules[8][15 - i - 1 + 1] = mod;
      } else {
        _modules[8][15 - i - 1] = mod;
      }
    }

    // fixed module
    _modules[_moduleCount - 8][8] = (!test);
  };

  const mapData = function(data, maskPattern) {

    let inc = -1;
    let row = _moduleCount - 1;
    let bitIndex = 7;
    let byteIndex = 0;
    const maskFunc = QRUtil.getMaskFunction(maskPattern);

    for (let col = _moduleCount - 1; col > 0; col -= 2) {

      if (col == 6) col -= 1;

      while (true) {

        for (let c = 0; c < 2; c += 1) {

          if (_modules[row][col - c] == null) {

            let dark = false;

            if (byteIndex < data.length) {
              dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
            }

            const mask = maskFunc(row, col - c);

            if (mask) {
              dark = !dark;
            }

            _modules[row][col - c] = dark;
            bitIndex -= 1;

            if (bitIndex == -1) {
              byteIndex += 1;
              bitIndex = 7;
            }
          }
        }

        row += inc;

        if (row < 0 || _moduleCount <= row) {
          row -= inc;
          inc = -inc;
          break;
        }
      }
    }
  };

  const createBytes = function(buffer, rsBlocks) {

    let offset = 0;

    let maxDcCount = 0;
    let maxEcCount = 0;

    const dcdata = new Array(rsBlocks.length);
    const ecdata = new Array(rsBlocks.length);

    for (let r = 0; r < rsBlocks.length; r += 1) {

      const dcCount = rsBlocks[r].dataCount;
      const ecCount = rsBlocks[r].totalCount - dcCount;

      maxDcCount = Math.max(maxDcCount, dcCount);
      maxEcCount = Math.max(maxEcCount, ecCount);

      dcdata[r] = new Array(dcCount);

      for (let i = 0; i < dcdata[r].length; i += 1) {
        dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
      }
      offset += dcCount;

      const rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
      const rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

      const modPoly = rawPoly.mod(rsPoly);
      ecdata[r] = new Array(rsPoly.getLength() - 1);
      for (let i = 0; i < ecdata[r].length; i += 1) {
        const modIndex = i + modPoly.getLength() - ecdata[r].length;
        ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
      }
    }

    let totalCodeCount = 0;
    for (let i = 0; i < rsBlocks.length; i += 1) {
      totalCodeCount += rsBlocks[i].totalCount;
    }

    const data = new Array(totalCodeCount);
    let index = 0;

    for (let i = 0; i < maxDcCount; i += 1) {
      for (let r = 0; r < rsBlocks.length; r += 1) {
        if (i < dcdata[r].length) {
          data[index] = dcdata[r][i];
          index += 1;
        }
      }
    }

    for (let i = 0; i < maxEcCount; i += 1) {
      for (let r = 0; r < rsBlocks.length; r += 1) {
        if (i < ecdata[r].length) {
          data[index] = ecdata[r][i];
          index += 1;
        }
      }
    }

    return data;
  };

  const createData = function(typeNumber, errorCorrectionLevel, dataList) {

    const rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

    const buffer = qrBitBuffer();

    for (let i = 0; i < dataList.length; i += 1) {
      const data = dataList[i];
      buffer.put(data.getMode(), 4);
      buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
      data.write(buffer);
    }

    // calc num max data.
    let totalDataCount = 0;
    for (let i = 0; i < rsBlocks.length; i += 1) {
      totalDataCount += rsBlocks[i].dataCount;
    }

    if (buffer.getLengthInBits() > totalDataCount * 8) {
      throw 'code length overflow. ('
        + buffer.getLengthInBits()
        + '>'
        + totalDataCount * 8
        + ')';
    }

    // end code
    if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
      buffer.put(0, 4);
    }

    // padding
    while (buffer.getLengthInBits() % 8 != 0) {
      buffer.putBit(false);
    }

    // padding
    while (true) {

      if (buffer.getLengthInBits() >= totalDataCount * 8) {
        break;
      }
      buffer.put(PAD0, 8);

      if (buffer.getLengthInBits() >= totalDataCount * 8) {
        break;
      }
      buffer.put(PAD1, 8);
    }

    return createBytes(buffer, rsBlocks);
  };

  _this.addData = function(data, mode) {

    mode = mode || 'Byte';

    let newData = null;

    switch(mode) {
    case 'Numeric' :
      newData = qrNumber(data);
      break;
    case 'Alphanumeric' :
      newData = qrAlphaNum(data);
      break;
    case 'Byte' :
      newData = qr8BitByte(data);
      break;
    case 'Kanji' :
      newData = qrKanji(data);
      break;
    default :
      throw 'mode:' + mode;
    }

    _dataList.push(newData);
    _dataCache = null;
  };

  _this.isDark = function(row, col) {
    if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
      throw row + ',' + col;
    }
    return _modules[row][col];
  };

  _this.getModuleCount = function() {
    return _moduleCount;
  };

  _this.make = function() {
    if (_typeNumber < 1) {
      let typeNumber = 1;

      for (; typeNumber < 40; typeNumber++) {
        const rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
        const buffer = qrBitBuffer();

        for (let i = 0; i < _dataList.length; i++) {
          const data = _dataList[i];
          buffer.put(data.getMode(), 4);
          buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
          data.write(buffer);
        }

        let totalDataCount = 0;
        for (let i = 0; i < rsBlocks.length; i++) {
          totalDataCount += rsBlocks[i].dataCount;
        }

        if (buffer.getLengthInBits() <= totalDataCount * 8) {
          break;
        }
      }

      _typeNumber = typeNumber;
    }

    makeImpl(false, getBestMaskPattern() );
  };

  _this.createTableTag = function(cellSize, margin) {

    cellSize = cellSize || 2;
    margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

    let qrHtml = '';

    qrHtml += '<table style="';
    qrHtml += ' border-width: 0px; border-style: none;';
    qrHtml += ' border-collapse: collapse;';
    qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
    qrHtml += '">';
    qrHtml += '<tbody>';

    for (let r = 0; r < _this.getModuleCount(); r += 1) {

      qrHtml += '<tr>';

      for (let c = 0; c < _this.getModuleCount(); c += 1) {
        qrHtml += '<td style="';
        qrHtml += ' border-width: 0px; border-style: none;';
        qrHtml += ' border-collapse: collapse;';
        qrHtml += ' padding: 0px; margin: 0px;';
        qrHtml += ' width: ' + cellSize + 'px;';
        qrHtml += ' height: ' + cellSize + 'px;';
        qrHtml += ' background-color: ';
        qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
        qrHtml += ';';
        qrHtml += '"/>';
      }

      qrHtml += '</tr>';
    }

    qrHtml += '</tbody>';
    qrHtml += '</table>';

    return qrHtml;
  };

  _this.createSvgTag = function(cellSize, margin, alt, title) {

    let opts = {};
    if (typeof arguments[0] == 'object') {
      // Called by options.
      opts = arguments[0];
      // overwrite cellSize and margin.
      cellSize = opts.cellSize;
      margin = opts.margin;
      alt = opts.alt;
      title = opts.title;
    }

    cellSize = cellSize || 2;
    margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

    // Compose alt property surrogate
    alt = (typeof alt === 'string') ? {text: alt} : alt || {};
    alt.text = alt.text || null;
    alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

    // Compose title property surrogate
    title = (typeof title === 'string') ? {text: title} : title || {};
    title.text = title.text || null;
    title.id = (title.text) ? title.id || 'qrcode-title' : null;

    const size = _this.getModuleCount() * cellSize + margin * 2;
    let c, mc, r, mr, qrSvg='', rect;

    rect = 'l' + cellSize + ',0 0,' + cellSize +
      ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

    qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
    qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
    qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
    qrSvg += ' preserveAspectRatio="xMinYMin meet"';
    qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
        escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
    qrSvg += '>';
    qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
        escapeXml(title.text) + '</title>' : '';
    qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
        escapeXml(alt.text) + '</description>' : '';
    qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
    qrSvg += '<path d="';

    for (r = 0; r < _this.getModuleCount(); r += 1) {
      mr = r * cellSize + margin;
      for (c = 0; c < _this.getModuleCount(); c += 1) {
        if (_this.isDark(r, c) ) {
          mc = c*cellSize+margin;
          qrSvg += 'M' + mc + ',' + mr + rect;
        }
      }
    }

    qrSvg += '" stroke="transparent" fill="black"/>';
    qrSvg += '</svg>';

    return qrSvg;
  };

  _this.createDataURL = function(cellSize, margin) {

    cellSize = cellSize || 2;
    margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

    const size = _this.getModuleCount() * cellSize + margin * 2;
    const min = margin;
    const max = size - margin;

    return createDataURL(size, size, function(x, y) {
      if (min <= x && x < max && min <= y && y < max) {
        const c = Math.floor( (x - min) / cellSize);
        const r = Math.floor( (y - min) / cellSize);
        return _this.isDark(r, c)? 0 : 1;
      } else {
        return 1;
      }
    } );
  };

  _this.createImgTag = function(cellSize, margin, alt) {

    cellSize = cellSize || 2;
    margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

    const size = _this.getModuleCount() * cellSize + margin * 2;

    let img = '';
    img += '<img';
    img += '\u0020src="';
    img += _this.createDataURL(cellSize, margin);
    img += '"';
    img += '\u0020width="';
    img += size;
    img += '"';
    img += '\u0020height="';
    img += size;
    img += '"';
    if (alt) {
      img += '\u0020alt="';
      img += escapeXml(alt);
      img += '"';
    }
    img += '/>';

    return img;
  };

  const escapeXml = function(s) {
    let escaped = '';
    for (let i = 0; i < s.length; i += 1) {
      const c = s.charAt(i);
      switch(c) {
      case '<': escaped += '&lt;'; break;
      case '>': escaped += '&gt;'; break;
      case '&': escaped += '&amp;'; break;
      case '"': escaped += '&quot;'; break;
      default : escaped += c; break;
      }
    }
    return escaped;
  };

  const _createHalfASCII = function(margin) {
    const cellSize = 1;
    margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

    const size = _this.getModuleCount() * cellSize + margin * 2;
    const min = margin;
    const max = size - margin;

    let y, x, r1, r2, p;

    const blocks = {
      '██': '█',
      '█ ': '▀',
      ' █': '▄',
      '  ': ' '
    };

    const blocksLastLineNoMargin = {
      '██': '▀',
      '█ ': '▀',
      ' █': ' ',
      '  ': ' '
    };

    let ascii = '';
    for (y = 0; y < size; y += 2) {
      r1 = Math.floor((y - min) / cellSize);
      r2 = Math.floor((y + 1 - min) / cellSize);
      for (x = 0; x < size; x += 1) {
        p = '█';

        if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
          p = ' ';
        }

        if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
          p += ' ';
        }
        else {
          p += '█';
        }

        // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
        ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
      }

      ascii += '\n';
    }

    if (size % 2 && margin > 0) {
      return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
    }

    return ascii.substring(0, ascii.length-1);
  };

  _this.createASCII = function(cellSize, margin) {
    cellSize = cellSize || 1;

    if (cellSize < 2) {
      return _createHalfASCII(margin);
    }

    cellSize -= 1;
    margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

    const size = _this.getModuleCount() * cellSize + margin * 2;
    const min = margin;
    const max = size - margin;

    let y, x, r, p;

    const white = Array(cellSize+1).join('██');
    const black = Array(cellSize+1).join('  ');

    let ascii = '';
    let line = '';
    for (y = 0; y < size; y += 1) {
      r = Math.floor( (y - min) / cellSize);
      line = '';
      for (x = 0; x < size; x += 1) {
        p = 1;

        if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
          p = 0;
        }

        // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
        line += p ? white : black;
      }

      for (r = 0; r < cellSize; r += 1) {
        ascii += line + '\n';
      }
    }

    return ascii.substring(0, ascii.length-1);
  };

  _this.renderTo2dContext = function(context, cellSize) {
    cellSize = cellSize || 2;
    const length = _this.getModuleCount();
    for (let row = 0; row < length; row++) {
      for (let col = 0; col < length; col++) {
        context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
        context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
      }
    }
  }

  return _this;
};

//---------------------------------------------------------------------
// qrcode.stringToBytes
//---------------------------------------------------------------------

qrcode.stringToBytes = function(s) {
  const bytes = [];
  for (let i = 0; i < s.length; i += 1) {
    const c = s.charCodeAt(i);
    bytes.push(c & 0xff);
  }
  return bytes;
};

//---------------------------------------------------------------------
// qrcode.createStringToBytes
//---------------------------------------------------------------------

/**
 * @param unicodeData base64 string of byte array.
 * [16bit Unicode],[16bit Bytes], ...
 * @param numChars
 */
qrcode.createStringToBytes = function(unicodeData, numChars) {

  // create conversion map.

  const unicodeMap = function() {

    const bin = base64DecodeInputStream(unicodeData);
    const read = function() {
      const b = bin.read();
      if (b == -1) throw 'eof';
      return b;
    };

    let count = 0;
    const unicodeMap = {};
    while (true) {
      const b0 = bin.read();
      if (b0 == -1) break;
      const b1 = read();
      const b2 = read();
      const b3 = read();
      const k = String.fromCharCode( (b0 << 8) | b1);
      const v = (b2 << 8) | b3;
      unicodeMap[k] = v;
      count += 1;
    }
    if (count != numChars) {
      throw count + ' != ' + numChars;
    }

    return unicodeMap;
  }();

  const unknownChar = '?'.charCodeAt(0);

  return function(s) {
    const bytes = [];
    for (let i = 0; i < s.length; i += 1) {
      const c = s.charCodeAt(i);
      if (c < 128) {
        bytes.push(c);
      } else {
        const b = unicodeMap[s.charAt(i)];
        if (typeof b == 'number') {
          if ( (b & 0xff) == b) {
            // 1byte
            bytes.push(b);
          } else {
            // 2bytes
            bytes.push(b >>> 8);
            bytes.push(b & 0xff);
          }
        } else {
          bytes.push(unknownChar);
        }
      }
    }
    return bytes;
  };
};

//---------------------------------------------------------------------
// QRMode
//---------------------------------------------------------------------

const QRMode = {
  MODE_NUMBER :    1 << 0,
  MODE_ALPHA_NUM : 1 << 1,
  MODE_8BIT_BYTE : 1 << 2,
  MODE_KANJI :     1 << 3
};

//---------------------------------------------------------------------
// QRErrorCorrectionLevel
//---------------------------------------------------------------------

const QRErrorCorrectionLevel = {
  L : 1,
  M : 0,
  Q : 3,
  H : 2
};

//---------------------------------------------------------------------
// QRMaskPattern
//---------------------------------------------------------------------

const QRMaskPattern = {
  PATTERN000 : 0,
  PATTERN001 : 1,
  PATTERN010 : 2,
  PATTERN011 : 3,
  PATTERN100 : 4,
  PATTERN101 : 5,
  PATTERN110 : 6,
  PATTERN111 : 7
};

//---------------------------------------------------------------------
// QRUtil
//---------------------------------------------------------------------

const QRUtil = function() {

  const PATTERN_POSITION_TABLE = [
    [],
    [6, 18],
    [6, 22],
    [6, 26],
    [6, 30],
    [6, 34],
    [6, 22, 38],
    [6, 24, 42],
    [6, 26, 46],
    [6, 28, 50],
    [6, 30, 54],
    [6, 32, 58],
    [6, 34, 62],
    [6, 26, 46, 66],
    [6, 26, 48, 70],
    [6, 26, 50, 74],
    [6, 30, 54, 78],
    [6, 30, 56, 82],
    [6, 30, 58, 86],
    [6, 34, 62, 90],
    [6, 28, 50, 72, 94],
    [6, 26, 50, 74, 98],
    [6, 30, 54, 78, 102],
    [6, 28, 54, 80, 106],
    [6, 32, 58, 84, 110],
    [6, 30, 58, 86, 114],
    [6, 34, 62, 90, 118],
    [6, 26, 50, 74, 98, 122],
    [6, 30, 54, 78, 102, 126],
    [6, 26, 52, 78, 104, 130],
    [6, 30, 56, 82, 108, 134],
    [6, 34, 60, 86, 112, 138],
    [6, 30, 58, 86, 114, 142],
    [6, 34, 62, 90, 118, 146],
    [6, 30, 54, 78, 102, 126, 150],
    [6, 24, 50, 76, 102, 128, 154],
    [6, 28, 54, 80, 106, 132, 158],
    [6, 32, 58, 84, 110, 136, 162],
    [6, 26, 54, 82, 110, 138, 166],
    [6, 30, 58, 86, 114, 142, 170]
  ];
  const G15 = (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0);
  const G18 = (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0);
  const G15_MASK = (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1);

  const _this = {};

  const getBCHDigit = function(data) {
    let digit = 0;
    while (data != 0) {
      digit += 1;
      data >>>= 1;
    }
    return digit;
  };

  _this.getBCHTypeInfo = function(data) {
    let d = data << 10;
    while (getBCHDigit(d) - getBCHDigit(G15) >= 0) {
      d ^= (G15 << (getBCHDigit(d) - getBCHDigit(G15) ) );
    }
    return ( (data << 10) | d) ^ G15_MASK;
  };

  _this.getBCHTypeNumber = function(data) {
    let d = data << 12;
    while (getBCHDigit(d) - getBCHDigit(G18) >= 0) {
      d ^= (G18 << (getBCHDigit(d) - getBCHDigit(G18) ) );
    }
    return (data << 12) | d;
  };

  _this.getPatternPosition = function(typeNumber) {
    return PATTERN_POSITION_TABLE[typeNumber - 1];
  };

  _this.getMaskFunction = function(maskPattern) {

    switch (maskPattern) {

    case QRMaskPattern.PATTERN000 :
      return function(i, j) { return (i + j) % 2 == 0; };
    case QRMaskPattern.PATTERN001 :
      return function(i, j) { return i % 2 == 0; };
    case QRMaskPattern.PATTERN010 :
      return function(i, j) { return j % 3 == 0; };
    case QRMaskPattern.PATTERN011 :
      return function(i, j) { return (i + j) % 3 == 0; };
    case QRMaskPattern.PATTERN100 :
      return function(i, j) { return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 == 0; };
    case QRMaskPattern.PATTERN101 :
      return function(i, j) { return (i * j) % 2 + (i * j) % 3 == 0; };
    case QRMaskPattern.PATTERN110 :
      return function(i, j) { return ( (i * j) % 2 + (i * j) % 3) % 2 == 0; };
    case QRMaskPattern.PATTERN111 :
      return function(i, j) { return ( (i * j) % 3 + (i + j) % 2) % 2 == 0; };

    default :
      throw 'bad maskPattern:' + maskPattern;
    }
  };

  _this.getErrorCorrectPolynomial = function(errorCorrectLength) {
    let a = qrPolynomial([1], 0);
    for (let i = 0; i < errorCorrectLength; i += 1) {
      a = a.multiply(qrPolynomial([1, QRMath.gexp(i)], 0) );
    }
    return a;
  };

  _this.getLengthInBits = function(mode, type) {

    if (1 <= type && type < 10) {

      // 1 - 9

      switch(mode) {
      case QRMode.MODE_NUMBER    : return 10;
      case QRMode.MODE_ALPHA_NUM : return 9;
      case QRMode.MODE_8BIT_BYTE : return 8;
      case QRMode.MODE_KANJI     : return 8;
      default :
        throw 'mode:' + mode;
      }

    } else if (type < 27) {

      // 10 - 26

      switch(mode) {
      case QRMode.MODE_NUMBER    : return 12;
      case QRMode.MODE_ALPHA_NUM : return 11;
      case QRMode.MODE_8BIT_BYTE : return 16;
      case QRMode.MODE_KANJI     : return 10;
      default :
        throw 'mode:' + mode;
      }

    } else if (type < 41) {

      // 27 - 40

      switch(mode) {
      case QRMode.MODE_NUMBER    : return 14;
      case QRMode.MODE_ALPHA_NUM : return 13;
      case QRMode.MODE_8BIT_BYTE : return 16;
      case QRMode.MODE_KANJI     : return 12;
      default :
        throw 'mode:' + mode;
      }

    } else {
      throw 'type:' + type;
    }
  };

  _this.getLostPoint = function(qrcode) {

    const moduleCount = qrcode.getModuleCount();

    let lostPoint = 0;

    // LEVEL1

    for (let row = 0; row < moduleCount; row += 1) {
      for (let col = 0; col < moduleCount; col += 1) {

        let sameCount = 0;
        const dark = qrcode.isDark(row, col);

        for (let r = -1; r <= 1; r += 1) {

          if (row + r < 0 || moduleCount <= row + r) {
            continue;
          }

          for (let c = -1; c <= 1; c += 1) {

            if (col + c < 0 || moduleCount <= col + c) {
              continue;
            }

            if (r == 0 && c == 0) {
              continue;
            }

            if (dark == qrcode.isDark(row + r, col + c) ) {
              sameCount += 1;
            }
          }
        }

        if (sameCount > 5) {
          lostPoint += (3 + sameCount - 5);
        }
      }
    };

    // LEVEL2

    for (let row = 0; row < moduleCount - 1; row += 1) {
      for (let col = 0; col < moduleCount - 1; col += 1) {
        let count = 0;
        if (qrcode.isDark(row, col) ) count += 1;
        if (qrcode.isDark(row + 1, col) ) count += 1;
        if (qrcode.isDark(row, col + 1) ) count += 1;
        if (qrcode.isDark(row + 1, col + 1) ) count += 1;
        if (count == 0 || count == 4) {
          lostPoint += 3;
        }
      }
    }

    // LEVEL3

    for (let row = 0; row < moduleCount; row += 1) {
      for (let col = 0; col < moduleCount - 6; col += 1) {
        if (qrcode.isDark(row, col)
            && !qrcode.isDark(row, col + 1)
            &&  qrcode.isDark(row, col + 2)
            &&  qrcode.isDark(row, col + 3)
            &&  qrcode.isDark(row, col + 4)
            && !qrcode.isDark(row, col + 5)
            &&  qrcode.isDark(row, col + 6) ) {
          lostPoint += 40;
        }
      }
    }

    for (let col = 0; col < moduleCount; col += 1) {
      for (let row = 0; row < moduleCount - 6; row += 1) {
        if (qrcode.isDark(row, col)
            && !qrcode.isDark(row + 1, col)
            &&  qrcode.isDark(row + 2, col)
            &&  qrcode.isDark(row + 3, col)
            &&  qrcode.isDark(row + 4, col)
            && !qrcode.isDark(row + 5, col)
            &&  qrcode.isDark(row + 6, col) ) {
          lostPoint += 40;
        }
      }
    }

    // LEVEL4

    let darkCount = 0;

    for (let col = 0; col < moduleCount; col += 1) {
      for (let row = 0; row < moduleCount; row += 1) {
        if (qrcode.isDark(row, col) ) {
          darkCount += 1;
        }
      }
    }

    const ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
    lostPoint += ratio * 10;

    return lostPoint;
  };

  return _this;
}();

//---------------------------------------------------------------------
// QRMath
//---------------------------------------------------------------------

const QRMath = function() {

  const EXP_TABLE = new Array(256);
  const LOG_TABLE = new Array(256);

  // initialize tables
  for (let i = 0; i < 8; i += 1) {
    EXP_TABLE[i] = 1 << i;
  }
  for (let i = 8; i < 256; i += 1) {
    EXP_TABLE[i] = EXP_TABLE[i - 4]
      ^ EXP_TABLE[i - 5]
      ^ EXP_TABLE[i - 6]
      ^ EXP_TABLE[i - 8];
  }
  for (let i = 0; i < 255; i += 1) {
    LOG_TABLE[EXP_TABLE[i] ] = i;
  }

  const _this = {};

  _this.glog = function(n) {

    if (n < 1) {
      throw 'glog(' + n + ')';
    }

    return LOG_TABLE[n];
  };

  _this.gexp = function(n) {

    while (n < 0) {
      n += 255;
    }

    while (n >= 256) {
      n -= 255;
    }

    return EXP_TABLE[n];
  };

  return _this;
}();

//---------------------------------------------------------------------
// qrPolynomial
//---------------------------------------------------------------------

const qrPolynomial = function(num, shift) {

  if (typeof num.length == 'undefined') {
    throw num.length + '/' + shift;
  }

  const _num = function() {
    let offset = 0;
    while (offset < num.length && num[offset] == 0) {
      offset += 1;
    }
    const _num = new Array(num.length - offset + shift);
    for (let i = 0; i < num.length - offset; i += 1) {
      _num[i] = num[i + offset];
    }
    return _num;
  }();

  const _this = {};

  _this.getAt = function(index) {
    return _num[index];
  };

  _this.getLength = function() {
    return _num.length;
  };

  _this.multiply = function(e) {

    const num = new Array(_this.getLength() + e.getLength() - 1);

    for (let i = 0; i < _this.getLength(); i += 1) {
      for (let j = 0; j < e.getLength(); j += 1) {
        num[i + j] ^= QRMath.gexp(QRMath.glog(_this.getAt(i) ) + QRMath.glog(e.getAt(j) ) );
      }
    }

    return qrPolynomial(num, 0);
  };

  _this.mod = function(e) {

    if (_this.getLength() - e.getLength() < 0) {
      return _this;
    }

    const ratio = QRMath.glog(_this.getAt(0) ) - QRMath.glog(e.getAt(0) );

    const num = new Array(_this.getLength() );
    for (let i = 0; i < _this.getLength(); i += 1) {
      num[i] = _this.getAt(i);
    }

    for (let i = 0; i < e.getLength(); i += 1) {
      num[i] ^= QRMath.gexp(QRMath.glog(e.getAt(i) ) + ratio);
    }

    // recursive call
    return qrPolynomial(num, 0).mod(e);
  };

  return _this;
};

const qrBitBuffer = function() {

  const _buffer = [];
  let _length = 0;

  const _this = {};

  _this.getBuffer = function() {
    return _buffer;
  };

  _this.getAt = function(index) {
    const bufIndex = Math.floor(index / 8);
    return ( (_buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
  };

  _this.put = function(num, length) {
    for (let i = 0; i < length; i += 1) {
      _this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
    }
  };

  _this.getLengthInBits = function() {
    return _length;
  };

  _this.putBit = function(bit) {

    const bufIndex = Math.floor(_length / 8);
    if (_buffer.length <= bufIndex) {
      _buffer.push(0);
    }

    if (bit) {
      _buffer[bufIndex] |= (0x80 >>> (_length % 8) );
    }

    _length += 1;
  };

  return _this;
};

//---------------------------------------------------------------------
// qrNumber
//---------------------------------------------------------------------

const qrNumber = function(data) {

  const _mode = QRMode.MODE_NUMBER;
  const _data = data;

  const _this = {};

  _this.getMode = function() {
    return _mode;
  };

  _this.getLength = function(buffer) {
    return _data.length;
  };

  _this.write = function(buffer) {

    const data = _data;

    let i = 0;

    while (i + 2 < data.length) {
      buffer.put(strToNum(data.substring(i, i + 3) ), 10);
      i += 3;
    }

    if (i < data.length) {
      if (data.length - i == 1) {
        buffer.put(strToNum(data.substring(i, i + 1) ), 4);
      } else if (data.length - i == 2) {
        buffer.put(strToNum(data.substring(i, i + 2) ), 7);
      }
    }
  };

  const strToNum = function(s) {
    let num = 0;
    for (let i = 0; i < s.length; i += 1) {
      num = num * 10 + chatToNum(s.charAt(i) );
    }
    return num;
  };

  const chatToNum = function(c) {
    if ('0' <= c && c <= '9') {
      return c.charCodeAt(0) - '0'.charCodeAt(0);
    }
    throw 'illegal char :' + c;
  };

  return _this;
};

//---------------------------------------------------------------------
// qrAlphaNum
//---------------------------------------------------------------------

const qrAlphaNum = function(data) {

  const _mode = QRMode.MODE_ALPHA_NUM;
  const _data = data;

  const _this = {};

  _this.getMode = function() {
    return _mode;
  };

  _this.getLength = function(buffer) {
    return _data.length;
  };

  _this.write = function(buffer) {

    const s = _data;

    let i = 0;

    while (i + 1 < s.length) {
      buffer.put(
        getCode(s.charAt(i) ) * 45 +
        getCode(s.charAt(i + 1) ), 11);
      i += 2;
    }

    if (i < s.length) {
      buffer.put(getCode(s.charAt(i) ), 6);
    }
  };

  const getCode = function(c) {

    if ('0' <= c && c <= '9') {
      return c.charCodeAt(0) - '0'.charCodeAt(0);
    } else if ('A' <= c && c <= 'Z') {
      return c.charCodeAt(0) - 'A'.charCodeAt(0) + 10;
    } else {
      switch (c) {
      case '\u0020' : return 36;
      case '$' : return 37;
      case '%' : return 38;
      case '*' : return 39;
      case '+' : return 40;
      case '-' : return 41;
      case '.' : return 42;
      case '/' : return 43;
      case ':' : return 44;
      default :
        throw 'illegal char :' + c;
      }
    }
  };

  return _this;
};

    // self test for sjis support.

      throw 'sjis not supported.';
    }

//---------------------------------------------------------------------
// byteArrayOutputStream
//---------------------------------------------------------------------

const byteArrayOutputStream = function() {

  const _bytes = [];

  const _this = {};

  _this.writeByte = function(b) {
    _bytes.push(b & 0xff);
  };

  _this.writeShort = function(i) {
    _this.writeByte(i);
    _this.writeByte(i >>> 8);
  };

  _this.writeBytes = function(b, off, len) {
    off = off || 0;
    len = len || b.length;
    for (let i = 0; i < len; i += 1) {
      _this.writeByte(b[i + off]);
    }
  };

  _this.writeString = function(s) {
    for (let i = 0; i < s.length; i += 1) {
      _this.writeByte(s.charCodeAt(i) );
    }
  };

  _this.toByteArray = function() {
    return _bytes;
  };

  _this.toString = function() {
    let s = '';
    s += '[';
    for (let i = 0; i < _bytes.length; i += 1) {
      if (i > 0) {
        s += ',';
      }
      s += _bytes[i];
    }
    s += ']';
    return s;
  };

  return _this;
};

//---------------------------------------------------------------------
// base64EncodeOutputStream
//---------------------------------------------------------------------

const base64EncodeOutputStream = function() {

  let _buffer = 0;
  let _buflen = 0;
  let _length = 0;
  let _base64 = '';

  const _this = {};

  const writeEncoded = function(b) {
    _base64 += String.fromCharCode(encode(b & 0x3f) );
  };

  const encode = function(n) {
    if (n < 0) {
      throw 'n:' + n;
    } else if (n < 26) {
      return 0x41 + n;
    } else if (n < 52) {
      return 0x61 + (n - 26);
    } else if (n < 62) {
      return 0x30 + (n - 52);
    } else if (n == 62) {
      return 0x2b;
    } else if (n == 63) {
      return 0x2f;
    } else {
      throw 'n:' + n;
    }
  };

  _this.writeByte = function(n) {

    _buffer = (_buffer << 8) | (n & 0xff);
    _buflen += 8;
    _length += 1;

    while (_buflen >= 6) {
      writeEncoded(_buffer >>> (_buflen - 6) );
      _buflen -= 6;
    }
  };

  _this.flush = function() {

    if (_buflen > 0) {
      writeEncoded(_buffer << (6 - _buflen) );
      _buffer = 0;
      _buflen = 0;
    }

    if (_length % 3 != 0) {
      // padding
      const padlen = 3 - _length % 3;
      for (let i = 0; i < padlen; i += 1) {
        _base64 += '=';
      }
    }
  };

  _this.toString = function() {
    return _base64;
  };

  return _this;
};

//---------------------------------------------------------------------
// base64DecodeInputStream
//---------------------------------------------------------------------

const base64DecodeInputStream = function(str) {

  const _str = str;
  let _pos = 0;
  let _buffer = 0;
  let _buflen = 0;

  const _this = {};

  _this.read = function() {

    while (_buflen < 8) {

      if (_pos >= _str.length) {
        if (_buflen == 0) {
          return -1;
        }
        throw 'unexpected end of file./' + _buflen;
      }

      const c = _str.charAt(_pos);
      _pos += 1;

      if (c == '=') {
        _buflen = 0;
        return -1;
      } else if (c.match(/^\s$/) ) {
        // ignore if whitespace.
        continue;
      }

      _buffer = (_buffer << 6) | decode(c.charCodeAt(0) );
      _buflen += 6;
    }

    const n = (_buffer >>> (_buflen - 8) ) & 0xff;
    _buflen -= 8;
    return n;
  };

  const decode = function(c) {
    if (0x41 <= c && c <= 0x5a) {
      return c - 0x41;
    } else if (0x61 <= c && c <= 0x7a) {
      return c - 0x61 + 26;
    } else if (0x30 <= c && c <= 0x39) {
      return c - 0x30 + 52;
    } else if (c == 0x2b) {
      return 62;
    } else if (c == 0x2f) {
      return 63;
    } else {
      throw 'c:' + c;
    }
  };

  return _this;
};

    const byteOut = byteArrayOutputStream();
    const bitOut = bitOutputStream(byteOut);

    // clear code
    bitOut.write(clearCode, bitLength);

    let dataIndex = 0;

    let s = String.fromCharCode(_data[dataIndex]);
    dataIndex += 1;

    while (dataIndex < _data.length) {

      const c = String.fromCharCode(_data[dataIndex]);
      dataIndex += 1;

      if (table.contains(s + c) ) {

        s = s + c;

      } else {

        bitOut.write(table.indexOf(s), bitLength);

        if (table.size() < 0xfff) {

          if (table.size() == (1 << bitLength) ) {
            bitLength += 1;
          }

          table.add(s + c);
        }

        s = c;
      }
    }

    bitOut.write(table.indexOf(s), bitLength);

    // end code
    bitOut.write(endCode, bitLength);

    bitOut.flush();

    return byteOut.toByteArray();
  };

  const lzwTable = function() {

    const _map = {};
    let _size = 0;

    const _this = {};

    _this.add = function(key) {
      if (_this.contains(key) ) {
        throw 'dup key:' + key;
      }
      _map[key] = _size;
      _size += 1;
    };

    _this.size = function() {
      return _size;
    };

    _this.indexOf = function(key) {
      return _map[key];
    };

    _this.contains = function(key) {
      return typeof _map[key] != 'undefined';
    };

    return _this;
  };

  return _this;
};

const createDataURL = function(width, height, getPixel) {
  const gif = gifImage(width, height);
  for (let y = 0; y < height; y += 1) {
    for (let x = 0; x < width; x += 1) {
      gif.setPixel(x, y, getPixel(x, y) );
    }
  }

  const b = byteArrayOutputStream();
  gif.write(b);

  const base64 = base64EncodeOutputStream();
  const bytes = b.toByteArray();
  for (let i = 0; i < bytes.length; i += 1) {
    base64.writeByte(bytes[i]);
  }
  base64.flush();

  return 'data:image/gif;base64,' + base64;
};

<script>
'use strict';

const MAX_DISTINCT_PRODUCTS = 15;
const MAX_MONEY = 1e10;
const LOGO_SIZE = 256;
const MAX_RECEIPT_NUMBER = 999999;

qrcode.stringToBytes = (text) => Array.from(new TextEncoder().encode(text));

// Base de datos

let db;
const emptyStore = { key: 'store', name: '', nit: '', whatsapp: '', logo: null, nextNumber: 1 };

function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('talonario', 1);
    request.onupgradeneeded = () => {
      request.result.createObjectStore('settings', { keyPath: 'key' });
      request.result.createObjectStore('products', { keyPath: 'id', autoIncrement: true });
      request.result.createObjectStore('sales', { keyPath: 'number' });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function asPromise(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function table(name, mode = 'readonly') {
  return db.transaction(name, mode).objectStore(name);
}

function finished(transaction) {
  return new Promise((resolve, reject) => {
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error);
  });
}

// Taking the number and saving the sale share one transaction, so a number can
// never be used twice or skipped by a failed save.
async function saveSale(items) {
  const transaction = db.transaction(['settings', 'sales'], 'readwrite');
  const settings = transaction.objectStore('settings');
  const sale = { status: 'activa', time: Date.now(), items };
  const stored = await asPromise(settings.get('store'));
  sale.number = stored.nextNumber;
  sale.store = { name: stored.name, nit: stored.nit, whatsapp: stored.whatsapp ?? '', logo: stored.logo };
  settings.put({ ...stored, nextNumber: stored.nextNumber + 1 });
  transaction.objectStore('sales').add(sale);
  await finished(transaction);
  return sale;
}

// Estado

let store = emptyStore;
let products = [];
let sales = [];
const order = new Map();
let editingId = null;
let formError = '';
let historyFilter = 'todas';
let textOnlyQr = false;
let reportAnchor = new Date();
let reportSeries = 'ventas';
const afterRender = [];

async function load() {
  store = (await asPromise(table('settings').get('store'))) ?? emptyStore;
  if (!store.nextNumber) store = { ...emptyStore, ...store };
  products = await asPromise(table('products').getAll());
  sales = await asPromise(table('sales').getAll());
  sales.reverse();
}

// Utilidades

function h(tag, props = {}, ...children) {
  const element = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key.startsWith('on')) element.addEventListener(key.slice(2), value);
    else if (key in element) element[key] = value;
    else element.setAttribute(key, value);
  }
  element.append(...children.flat().filter((child) => child !== null && child !== undefined));
  return element;
}

function money(pesos) {
  const sign = pesos < 0 ? '-' : '';
  return `${sign}$${Math.abs(pesos).toLocaleString('es-CO')}`;
}

function folio(number) {
  return String(number).padStart(4, '0');
}

function dateText(time) {
  const d = new Date(time);
  const two = (n) => String(n).padStart(2, '0');
  return `${two(d.getDate())}/${two(d.getMonth() + 1)}/${d.getFullYear()} ${two(d.getHours())}:${two(d.getMinutes())}`;
}

function saleTotal(sale) {
  return sale.items.reduce((sum, item) => sum + item.qty * item.price, 0);
}

function pesos(value) {
  const number = Number(value);
  return Number.isInteger(number) && Math.abs(number) <= MAX_MONEY ? number : null;
}

// What the customer receives. It never includes the profit.
function receiptHead(storeData, number, time) {
  const head = [storeData.name];
  if (storeData.nit) head.push(`NIT ${storeData.nit}`);
  head.push(`Recibo ${folio(number)}`, dateText(time));
  return head;
}

function receiptText(sale) {
  const head = receiptHead(sale.store, sale.number, sale.time);
  const lines = sale.items.map((item) => `${item.qty} x ${item.name} ${money(item.qty * item.price)}`);
  return [...head, '', ...lines, '', `TOTAL ${money(saleTotal(sale))}`].join('\n');
}

function whatsappText(sale) {
  const [name, ...head] = receiptHead(sale.store, sale.number, sale.time);
  const lines = sale.items.map((item) => `${item.qty} x ${item.name} ${money(item.qty * item.price)}`);
  return [`*${name}*`, ...head, '', ...lines, '', `*TOTAL ${money(saleTotal(sale))}*`].join('\n');
}

function whatsappUrl(sale) {
  return `https://wa.me/${sale.store.whatsapp}?text=${encodeURIComponent(whatsappText(sale))}`;
}

function renderQr(text) {
  const code = qrcode(0, 'L');
  try {
    code.addData(text, 'Byte');
    code.make();
  } catch {
    return null;
  }
  const size = code.getModuleCount();
  const quiet = 4;
  let path = '';
  for (let row = 0; row < size; row++) {
    for (let col = 0; col < size; col++) {
      if (code.isDark(row, col)) path += `M${col + quiet} ${row + quiet}h1v1h-1z`;
    }
  }
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  const total = size + quiet * 2;
  svg.setAttribute('viewBox', `0 0 ${total} ${total}`);
  svg.setAttribute('class', 'qr-code');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Código QR del recibo');
  svg.setAttribute('shape-rendering', 'crispEdges');
  const shape = document.createElementNS(ns, 'path');
  shape.setAttribute('d', path);
  svg.append(shape);
  return svg;
}

  await load();

function renderCheckout() {
  const chosen = products.filter((p) => order.has(p.id));

  else if (profit === null) formError = 'Escribe la ganancia en pesos, sin decimales.';

    const message = form.querySelector('.field-error');
    message.textContent = formError;
    message.hidden = false;
    return;

  const record = { name, price, profit };
  if (editingId !== null) record.id = editingId;
  await asPromise(table('products', 'readwrite').put(record));
  editingId = null;
  await load();

  render();

function resizeLogo(file) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    const url = URL.createObjectURL(file);
    image.onload = () => {
      const scale = Math.min(1, LOGO_SIZE / Math.max(image.width, image.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/png'));
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('invalid image'));
    };
    image.src = url;
  });
}

  try {
    await saveStore({ logo: await resizeLogo(file) });

    message.textContent = 'No se pudo leer ese archivo. Elige una imagen PNG o JPG.';

  event.preventDefault();

  const name = form.elements.name.value.trim();
  const stamp = form.querySelector('.stamp');
  if (!name) {
    stamp.className = 'stamp field-error';
    stamp.textContent = 'Escribe el nombre de la tienda.';
    return;

  const whatsapp = form.elements.whatsapp.value.replace(/\D/g, '');
  if (whatsapp && (whatsapp.length < 11 || whatsapp.length > 15)) {
    stamp.className = 'stamp field-error';
    stamp.textContent = 'Escribe el WhatsApp con código de país, por ejemplo 573001234567.';
    return;
  }
  const nextNumber = Number(form.elements.nextNumber.value);
  const lowest = firstFreeNumber();
  if (!Number.isInteger(nextNumber) || nextNumber < lowest || nextNumber > MAX_RECEIPT_NUMBER) {
    stamp.className = 'stamp field-error';
    stamp.textContent = lowest > 1
      ? `El siguiente recibo debe ser un número entero desde ${lowest}, porque el ${folio(lowest - 1)} ya existe.`
      : 'El siguiente recibo debe ser un número entero desde 1.';

// Reportes

const UNITS = { dia: 'Día', mes: 'Mes', anio: 'Año' };
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function saleProfit(sale) {
  return sale.items.reduce((sum, item) => sum + item.qty * item.profit, 0);
}

function inPeriod(time, unit, anchor) {
  const d = new Date(time);
  if (d.getFullYear() !== anchor.getFullYear()) return false;
  if (unit === 'anio') return true;
  if (d.getMonth() !== anchor.getMonth()) return false;
  return unit === 'mes' || d.getDate() === anchor.getDate();
}

function shiftPeriod(anchor, unit, step) {
  if (unit === 'dia') return new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() + step);
  if (unit === 'mes') return new Date(anchor.getFullYear(), anchor.getMonth() + step, 1);
  return new Date(anchor.getFullYear() + step, 0, 1);
}

function periodLabel(anchor, unit) {
  if (unit === 'anio') return String(anchor.getFullYear());
  const options = unit === 'mes' ? { month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long', year: 'numeric' };
  return anchor.toLocaleDateString('es-CO', options);
}

// Voided sales never count in a total.
function productTotals(list) {
  const byName = new Map();
  for (const sale of list) {
    for (const item of sale.items) {
      const row = byName.get(item.name) ?? { name: item.name, qty: 0, sales: 0, profit: 0 };
      row.qty += item.qty;
      row.sales += item.qty * item.price;
      row.profit += item.qty * item.profit;
      byName.set(item.name, row);
    }
  }
  return [...byName.values()].sort((a, b) => b.sales - a.sales);
}

const SVG_NS = 'http://www.w3.org/2000/svg';
const compact = new Intl.NumberFormat('es', { notation: 'compact', maximumFractionDigits: 1 });

function svgNode(tag, attributes, parent) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  parent.append(node);
  return node;
}

// Round steps whose range holds every value, with zero always on a gridline.
function chartTicks(values) {
  const low = Math.min(0, ...values);
  const high = Math.max(0, ...values);
  const range = high - low || 1000;
  const magnitude = 10 ** Math.floor(Math.log10(range / 4));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * magnitude).find((s) => s >= range / 4);
  const ticks = [];
  for (let v = Math.floor(low / step) * step; v <= high || ticks.length < 2; v += step) ticks.push(v);
  if (ticks.at(-1) <= high) ticks.push(ticks.at(-1) + step);
  return ticks;
}

function drawBars(container, { title, labels, values, shown }) {
  const paint = () => {
    const width = container.clientWidth;
    if (!width) return;
    const height = 200;
    const bottom = 26;
    const ticks = chartTicks(values);
    const tickText = (v) => compact.format(v);
    const left = Math.max(...ticks.map((v) => tickText(v).length)) * 7 + 12;
    const y = (v) => (height - bottom) * (1 - (v - ticks[0]) / (ticks.at(-1) - ticks[0])) + 6;
    const band = (width - left) / values.length;
    const barWidth = Math.max(2, band * 0.62);
    const x = (i) => left + band * i + band / 2;

    const best = values.indexOf(Math.max(...values));
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', values.some((v) => v !== 0)
      ? `${title}. Máximo ${money(values[best])} en ${labels[best]}.`
      : `${title}. Sin datos en este periodo.`);

    for (const tick of ticks) {
      svgNode('line', { x1: left, x2: width, y1: y(tick), y2: y(tick), class: tick === 0 ? 'chart-zero' : 'chart-grid' }, svg);
      svgNode('text', { x: left - 8, y: y(tick) + 4, 'text-anchor': 'end', class: 'chart-text' }, svg).textContent = tickText(tick);
    }
    values.forEach((value, i) => {
      if (value === 0) return;
      const bar = svgNode('rect', {
        x: x(i) - barWidth / 2,
        y: Math.min(y(value), y(0)),
        width: barWidth,
        height: Math.abs(y(value) - y(0)),
        class: value < 0 ? 'chart-bar chart-loss' : 'chart-bar',
      }, svg);
      svgNode('title', {}, bar).textContent = `${labels[i]}: ${money(value)}`;
    });
    for (const i of shown) {
      svgNode('text', { x: x(i), y: height - 6, 'text-anchor': 'middle', class: 'chart-text' }, svg).textContent = labels[i];
    }
    container.replaceChildren(svg);
  };
  paint();
  const observer = new ResizeObserver(() => {
    if (!container.isConnected) observer.disconnect();
    else if (container.firstChild?.getAttribute('width') !== String(container.clientWidth)) paint();
  });
  observer.observe(container);
}

function renderTrend(active, unit, anchor) {
  const buckets = unit === 'mes'
    ? new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0).getDate()
    : 12;
  const values = Array(buckets).fill(0);
  for (const sale of active) {
    const d = new Date(sale.time);
    const index = unit === 'mes' ? d.getDate() - 1 : d.getMonth();
    values[index] += reportSeries === 'ganancia' ? saleProfit(sale) : saleTotal(sale);
  }
  const labels = unit === 'mes' ? values.map((_, i) => String(i + 1)) : MONTHS;
  const shown = unit === 'mes' ? labels.map((_, i) => i).filter((i) => i % 5 === 4) : labels.map((_, i) => i);
  const name = reportSeries === 'ganancia' ? 'Ganancia' : 'Ventas';
  const chart = h('div', { className: 'chart' });
  const title = `${name} por ${unit === 'mes' ? 'día' : 'mes'}`;
  afterRender.push(() => drawBars(chart, { title, labels, values, shown }));
  return h('section', { className: 'card card-pad' },
    h('h2', {}, title),
    chart,
  );
}

function renderReports(param) {
  const unit = UNITS[param] ? param : 'dia';
  const now = new Date();
  const list = sales.filter((sale) => inPeriod(sale.time, unit, reportAnchor));
  const active = list.filter((sale) => sale.status === 'activa');
  const voidedCount = list.length - active.length;
  const totalSales = active.reduce((sum, sale) => sum + saleTotal(sale), 0);
  const totalProfit = active.reduce((sum, sale) => sum + saleProfit(sale), 0);
  const hasChart = unit !== 'dia';
  const atPresent = inPeriod(now.getTime(), unit, reportAnchor);

  const kpi = (series, id, label, value, className) => {
    const body = [h('span', { className: 'kpi-label' }, label), h('strong', { id, className }, value)];
    return hasChart
      ? h('button', {
        type: 'button',
        className: 'kpi',
        id: `tab-${series}`,
        ariaPressed: String(reportSeries === series),
        onclick: () => { reportSeries = series; render(); },
      }, body)
      : h('div', { className: 'kpi' }, body);
  };

  return screen('Reportes', null,
    h('button', { type: 'button', id: 'export-xlsx', className: 'button primary', disabled: sales.length === 0, onclick: exportWorkbook }, 'Exportar a Excel'),
    h('div', { className: 'report-controls' },
      h('div', { className: 'segmented', role: 'group', ariaLabel: 'Periodo' }, Object.entries(UNITS).map(([key, label]) => h('a', {
        id: `unit-${key}`,
        href: `#reportes/${key}`,
        'aria-current': key === unit ? 'true' : 'false',
      }, label))),
      h('div', { className: 'period' },
        h('button', { type: 'button', id: 'period-prev', className: 'button', ariaLabel: 'Periodo anterior', onclick: () => { reportAnchor = shiftPeriod(reportAnchor, unit, -1); render(); } }, '‹'),
        h('span', { id: 'period-label', className: 'period-label' }, periodLabel(reportAnchor, unit)),
        h('button', { type: 'button', id: 'period-next', className: 'button', ariaLabel: 'Periodo siguiente', disabled: atPresent, onclick: () => { reportAnchor = shiftPeriod(reportAnchor, unit, 1); render(); } }, '›'),
      ),
    ),
    h('section', { className: 'card kpis', ariaLabel: 'Totales del periodo' },
      kpi('ventas', 'kpi-sales', 'Ventas', money(totalSales), 'kpi-lead money'),
      kpi('ganancia', 'kpi-profit', 'Ganancia', money(totalProfit), totalProfit < 0 ? 'kpi-value money loss' : 'kpi-value money'),
      h('div', { className: 'kpi' },
        h('span', { className: 'kpi-label' }, 'Recibos'),
        h('strong', { id: 'kpi-receipts', className: 'kpi-value' }, String(active.length)),
        voidedCount > 0 ? h('span', { className: 'kpi-note' }, voidedCount === 1 ? '1 anulado no cuenta' : `${voidedCount} anulados no cuentan`) : null,
      ),
    ),
    h('div', { className: 'split half' },
      hasChart ? renderTrend(active, unit, reportAnchor) : renderDayReceipts(list),
      renderProductTotals(active),
    ),
  );
}

<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>
